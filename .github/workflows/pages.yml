name: Deploy to GitHub Pages

# Publishes the static/ folder as the site root. The dashboard is fully
# client-side: it fetches MTA's GTFS-realtime feeds directly from the browser,
# so no server runs in production.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
