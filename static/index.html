<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NYC Subway</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a1826; color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    width: 1920px; height: 1080px;
    overflow: hidden; display: flex; flex-direction: row;
  }
  /* One continuous dark surface; thin subtle dividers between the 3 panes */
  #left { width: 1120px; height: 1080px; position: relative; }
  #right { width: 800px; height: 1080px; display: flex; flex-direction: column;
           border-left: 1px solid #1b2c38; }
  #area-wrap { height: 330px; position: relative; border-bottom: 1px solid #1b2c38; }
  #bottom { flex: 1; display: flex; flex-direction: column; padding: 22px 30px; overflow: hidden; }

  .map-label { position: absolute; top: 16px; left: 22px; font-size: 0.78rem;
               color: #3d5260; letter-spacing: 3px; text-transform: uppercase; z-index: 2; }
  svg { display: block; }

  /* Clock overlaid on the top-left of the big map */
  #clock { position: absolute; top: 26px; left: 28px; z-index: 2;
           font-size: 4.4rem; font-weight: 200; letter-spacing: 6px; line-height: 1;
           color: #eaf2f7; text-shadow: 0 2px 14px #000; }
  #clock-date { position: absolute; top: 108px; left: 30px; z-index: 2;
                font-size: 0.95rem; color: #5a6b76; letter-spacing: 2px; }
  #bottom-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  #address { font-size: 1.05rem; color: #6a7b86; }
  #updated { font-size: 0.74rem; color: #34454f; }

  .stations-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .station {
    background: #0e1c26; border-radius: 12px; padding: 10px 16px;
    border: 1px solid #1b2c38; display: flex; gap: 18px; align-items: center;
    flex: 1; min-height: 0;
  }
  .station-left { flex-shrink: 0; width: 150px; }
  .station-name { font-size: 1rem; font-weight: 500; margin-bottom: 4px; }
  .station-meta { font-size: 0.74rem; color: #444; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .line-badge { border-radius: 50%; display: inline-flex; align-items: center;
                justify-content: center; font-weight: 700; flex-shrink: 0; }
  .line-L { background: #7c858c; color: #000; }
  .line-G { background: #799534; color: #fff; }
  .line-J, .line-Z { background: #8e5c33; color: #fff; }
  .line-M { background: #eb6800; color: #fff; }
  .line-A, .line-C, .line-E { background: #0062cf; color: #fff; }
  .line-B, .line-D, .line-F { background: #eb6800; color: #fff; }
  .line-N, .line-Q, .line-R, .line-W { background: #f6bc26; color: #000; }
  .line-1, .line-2, .line-3 { background: #d82233; color: #fff; }
  .line-4, .line-5, .line-6 { background: #009952; color: #fff; }
  .line-7 { background: #9a38a1; color: #fff; }
  .arrivals-row { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .arrival-chip { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                  padding: 8px 12px; border-radius: 9px; background: #0a141b; border: 1px solid #1b2c38;
                  width: 150px; }
  .arrival-chip.gone      { opacity: 0.25; }
  .arrival-chip.catchable { border-color: #1e3a1e; }
  .arrival-chip.urgent    { border-color: #4a3a00; background: #0f0c00; }
  .chip-icon { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .chip-dir { font-size: 0.82rem; color: #c2ccd2; font-weight: 600; line-height: 1.1; text-align: center;
              max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .chip-time { font-size: 1.5rem; font-weight: 200; line-height: 1; min-width: 34px; text-align: right; }
  .chip-time .unit { font-size: 0.6rem; color: #555; }
  .chip-pill { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
  .pill-gone      { background: #1a1a1a; color: #333; }
  .pill-leave     { background: #4a3a00; color: #fccc0a; }
  .pill-catchable { background: #1a3a1a; color: #6cbe45; }

  .map-line  { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .map-stop  { fill: #e6ebee; stroke: none; }
  .your-stop { fill: none; stroke-width: 3; }
  .home-ring { fill: none; stroke: #fff; stroke-width: 1.5; opacity: 0.6; }
  .train-dot { stroke: rgba(0,0,0,0.55); stroke-width: 1; }
  .boro-land { fill: #0b1722; stroke: #1d2f3f; stroke-width: 1; }
  .boro-label { fill: #5a6f7e; font-weight: 700; text-anchor: middle; letter-spacing: 3px; }
  .stop-label { fill: #eaf2f7; font-size: 18px; font-weight: 600; letter-spacing: 0.3px;
                paint-order: stroke; stroke: #0a1826; stroke-width: 3.5px; }
</style>
</head>
<body>
  <div id="left">
    <div id="clock">--:--:--</div>
    <div id="clock-date">NEW YORK CITY · LIVE</div>
    <svg id="city-svg"></svg>
  </div>
  <div id="right">
    <div id="area-wrap"><div class="map-label">Local stops</div><svg id="area-svg"></svg></div>
    <div id="bottom">
      <div id="bottom-head">
        <div id="address">114 Leonard St, Brooklyn</div>
        <div id="updated">--</div>
      </div>
      <div class="stations-panel" id="stations-panel"><div style="color:#222">loading...</div></div>
    </div>
  </div>

<script>
const HOME = { lat: 40.70742, lon: -73.94640 };
const YOUR_STOP_IDS = ["L10", "G29", "M14", "L13", "G30"];
const YOUR_STOP_COLORS = { "L10": "#7c858c", "G29": "#799534", "M14": "#eb6800", "L13": "#7c858c", "G30": "#799534" };
// Names to label on the local map (the stations you actually use)
const STATION_LABELS = { "L10": "Lorimer St", "M14": "Hewes St", "L13": "Montrose Av", "G30": "Broadway" };

// Region of interest for each map. drawn to fill its box (no letterbox).
const CITY_ROI = { min_lat: 40.690, max_lat: 40.800, min_lon: -73.970, max_lon: -73.920 };
const AREA_ROI = { min_lat: 40.700, max_lat: 40.724, min_lon: -73.962, max_lon: -73.930 };

const TRUNK = ["1","2","3","4","5","6","7","A","C","E","N","Q","R","W","L"];
const ROUTE_SLOT = {};   // routeId -> offset slot, so overlapping colors fan out
const STOP_ON_LINE = {}; // stopId -> {route, s}: where the stop sits on a drawn line
let mapData = null;
let vehicles = [];
const vehSeg = new Map();   // trip id -> {next, seg}: locked segment duration
const VIEWS = [];           // each: {trainsG, vehEls, boxW, boxH, trainR, pointFor}
const SCHEM = {};           // schematic layout data (built in setupSchematic)

function pad(n) { return String(n).padStart(2, "0"); }
function tick() {
  const d = new Date();
  document.getElementById("clock").textContent =
    pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
setInterval(tick, 1000); tick();

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}

// (lat,lon) -> local coords: equal-distance about center, rotated (Manhattan
// upright), then a piecewise-linear HORIZONTAL stretch that widens the Manhattan
// band [L,R] by factor E and compresses the river/outer-borough bands by C.
// Piecewise-linear keeps lines straight (only a slight kink where a line crosses
// a band edge, e.g. a shoreline). Box scale is applied in project().
function localXform(p, lat, lon) {
  const ex = (lon - p.cLon) * p.cosLat;
  const ny = (lat - p.cLat);
  let rx = ex * p.cosT - ny * p.sinT;
  const ry = ex * p.sinT + ny * p.cosT;
  if (p.E) {
    if (rx > p.R) rx = p.mc + p.E * (p.R - p.mc) + p.C * (rx - p.R);
    else if (rx < p.L) rx = p.mc + p.E * (p.L - p.mc) + p.C * (rx - p.L);
    else rx = p.mc + p.E * (rx - p.mc);
  }
  return [rx, ry];
}

function project(p, lat, lon) {
  const [lx, ly] = localXform(p, lat, lon);
  return [p.bx + (lx - p.midX) * p.scale, p.by - (ly - p.midY) * p.scale];
}

function buildProj(roi, boxW, boxH, pad, o) {
  o = o || {};
  const cLat = (roi.min_lat + roi.max_lat) / 2;
  const cLon = (roi.min_lon + roi.max_lon) / 2;
  const cosLat = Math.cos(cLat * Math.PI / 180);
  const innerW = boxW - pad * 2, innerH = boxH - pad * 2;
  let latSpan = roi.max_lat - roi.min_lat;
  let lonSpan = roi.max_lon - roi.min_lon;
  const boxAspect = innerW / innerH;
  if ((lonSpan * cosLat) / latSpan < boxAspect) lonSpan = latSpan * boxAspect / cosLat;
  else latSpan = lonSpan * cosLat / boxAspect;
  const NLAT = cLat - latSpan / 2, XLAT = cLat + latSpan / 2;
  const NLON = cLon - lonSpan / 2, XLON = cLon + lonSpan / 2;

  const T = (o.rotate || 0) * Math.PI / 180;
  const cosT = Math.cos(T), sinT = Math.sin(T);
  const p = { cLat, cLon, cosLat, cosT, sinT, E: 0 };
  if (o.stretchE) {
    // Manhattan band edges in rotated rx (from west/east shore anchors).
    const rxOf = (la, lo) => ((lo - cLon) * cosLat) * cosT - (la - cLat) * sinT;
    let L = rxOf(o.wLat, o.wLon), R = rxOf(o.eLat, o.eLon);
    if (L > R) { const t = L; L = R; R = t; }
    p.L = L; p.R = R; p.mc = (L + R) / 2; p.E = o.stretchE; p.C = o.stretchC || 0.5;
  }
  // Fit the transformed window into the box by sampling a grid.
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const N = 10;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const [lx, ly] = localXform(p, NLAT + (XLAT - NLAT) * i / N, NLON + (XLON - NLON) * j / N);
    if (lx < minX) minX = lx; if (lx > maxX) maxX = lx;
    if (ly < minY) minY = ly; if (ly > maxY) maxY = ly;
  }
  p.scale = Math.min(innerW / ((maxX - minX) || 1e-9), innerH / ((maxY - minY) || 1e-9));
  p.midX = (minX + maxX) / 2; p.midY = (minY + maxY) / 2;
  p.bx = boxW / 2; p.by = boxH / 2;
  return p;
}

// Build an SVG path for a projected polyline, shifted perpendicular by `off` px
// so routes sharing the same track render as parallel colored lines.
function offsetPath(pts, off) {
  let d = "";
  for (let i = 0; i < pts.length; i++) {
    let x = pts[i][0], y = pts[i][1];
    if (off !== 0) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const len = Math.hypot(tx, ty) || 1;
      x += (-ty / len) * off;
      y += (tx / len) * off;
    }
    d += (i ? " L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }
  return d;
}

// Screen position of a stop, placed on its route's color-offset line (so the
// dot sits on the line, not on the un-offset true coordinate). Falls back to
// the raw coordinate for stops not on any drawn trunk.
function stopPx(proj, ls, stop) {
  const info = STOP_ON_LINE[stop.id];
  if (!info) return project(proj, stop.lat, stop.lon);
  const rp = mapData.route_paths[info.route];
  let [x, y] = project(proj, ...sampleAlong(rp, info.s));
  const slot = ROUTE_SLOT[info.route] || 0;
  if (slot) {
    const [ax, ay] = project(proj, ...sampleAlong(rp, Math.min(1, info.s + 0.003)));
    const tx = ax - x, ty = ay - y, len = Math.hypot(tx, ty) || 1;
    const off = slot * 1.8 * ls;
    x += (-ty / len) * off; y += (tx / len) * off;
  }
  return [x, y];
}

function sampleAlong(rp, s) {
  s = Math.max(0, Math.min(1, s));
  const cum = rp.cum, path = rp.path;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m + 1; else hi = m; }
  const i = Math.max(1, lo);
  const seg = (cum[i] - cum[i - 1]) || 1e-9;
  const f = (s - cum[i - 1]) / seg;
  return [
    path[i - 1][0] + f * (path[i][0] - path[i - 1][0]),
    path[i - 1][1] + f * (path[i][1] - path[i - 1][1]),
  ];
}

function setupView(svgId, roi, boxW, boxH, opts) {
  const svg = document.getElementById(svgId);
  svg.setAttribute("viewBox", `0 0 ${boxW} ${boxH}`);
  svg.setAttribute("width", boxW); svg.setAttribute("height", boxH);
  svg.innerHTML = "";
  const proj = buildProj(roi, boxW, boxH, opts.pad ?? 22, opts);
  const cull = (x, y) => x < -30 || x > boxW + 30 || y < -30 || y > boxH + 30;

  svgEl("rect", { x: 0, y: 0, width: boxW, height: boxH, fill: "#173a59" }, svg); // water

  const landG = svgEl("g", {}, svg);
  for (const b of (mapData.boroughs || [])) {
    for (const ring of b.rings) {
      const d = ring.map(([lat, lon], i) => {
        const [x, y] = project(proj, lat, lon);
        return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      }).join(" ") + " Z";
      svgEl("path", { d, class: "boro-land" }, landG);
    }
  }
  if (opts.labels) {
    for (const b of (mapData.boroughs || [])) {
      const [x, y] = project(proj, b.label[0], b.label[1]);
      if (cull(x, y)) continue;
      const t = svgEl("text", { x, y, class: "boro-label", "font-size": opts.labelSize || 36 }, svg);
      t.textContent = b.name.toUpperCase();
    }
  }

  // One clean line per route (its trunk), offset perpendicular by color so only
  // different-colored routes fan apart; same-color routes stack into one line.
  const linesG = svgEl("g", {}, svg);
  const ls = opts.lineScale || 1;
  const spacing = 1.8 * ls;
  for (const [routeId, rp] of Object.entries(mapData.route_paths)) {
    if (!rp.path || rp.path.length < 2) continue;
    const color = mapData.route_colors[routeId] || "#444";
    const w = (TRUNK.includes(routeId) ? 3.8 : 2.8) * ls;
    const off = (ROUTE_SLOT[routeId] || 0) * spacing;
    const pts = rp.path.map(([lat, lon]) => project(proj, lat, lon));
    svgEl("path", { d: offsetPath(pts, off), class: "map-line", stroke: color, "stroke-width": w }, linesG);
  }

  const stopsG = svgEl("g", {}, svg);
  for (const stop of mapData.stops) {
    const [x, y] = stopPx(proj, ls, stop);
    if (cull(x, y)) continue;
    if (YOUR_STOP_IDS.includes(stop.id)) {
      const color = YOUR_STOP_COLORS[stop.id] || "#fff";
      svgEl("circle", { cx: x, cy: y, r: (opts.yourR || 8), class: "your-stop", stroke: color }, stopsG);
      svgEl("circle", { cx: x, cy: y, r: (opts.yourR || 8) * 0.42, fill: color }, stopsG);
    } else {
      svgEl("circle", { cx: x, cy: y, r: opts.stopR || 2, class: "map-stop" }, stopsG);
    }
  }

  const [hx, hy] = project(proj, HOME.lat, HOME.lon);
  svgEl("circle", { cx: hx, cy: hy, r: opts.homeR || 13, class: "home-ring" }, svg);
  svgEl("circle", { cx: hx, cy: hy, r: (opts.homeR || 13) * 0.36, fill: "#fff" }, svg);

  const trainsG = svgEl("g", {}, svg);

  if (opts.stopLabels) {
    for (const stop of mapData.stops) {
      const name = STATION_LABELS[stop.id];
      if (!name) continue;
      const [x, y] = stopPx(proj, ls, stop);
      const t = svgEl("text", { x: x + 13, y: y + 6, class: "stop-label" }, svg);
      t.textContent = name;
    }
  }

  const view = { trainsG, vehEls: new Map(), boxW, boxH, trainR: opts.trainR || 5.5 };
  view.pointFor = function (v, now) {                 // geographic train placement
    const info = trainLatLon(v, now);
    if (!info) return null;
    let [x, y] = project(proj, info.pt[0], info.pt[1]);
    const slot = ROUTE_SLOT[v.route] || 0;
    if (slot !== 0 && info.ahead) {
      const [ax, ay] = project(proj, info.ahead[0], info.ahead[1]);
      const tx = ax - x, ty = ay - y, len = Math.hypot(tx, ty) || 1;
      const off = slot * 1.8 * ls;
      x += (-ty / len) * off; y += (tx / len) * off;
    }
    return [x, y];
  };
  VIEWS.push(view);
}

// Returns the train's position on its route path plus a point just ahead (for
// tangent), so animateTrains can shift it onto the same color-offset line.
function trainLatLon(v, now) {
  const rp = mapData.route_paths[v.route];
  if (rp && rp.stopT[v.next] !== undefined) {
    const ns = rp.stopT[v.next];
    const ps = (v.prev != null && rp.stopT[v.prev] !== undefined) ? rp.stopT[v.prev] : ns;
    let frac = 1 - (v.next_arr - now) / (v._seg || v.seg_time || 90);
    frac = Math.max(0, Math.min(1, frac));
    const s = ps + frac * (ns - ps);
    return { pt: sampleAlong(rp, s), ahead: sampleAlong(rp, Math.min(1, s + 0.003)) };
  }
  return null;  // stop isn't on the drawn trunk (a branch) -> hide, no floating dot
}

function animateTrains() {
  if (!mapData) return;
  const now = Date.now() / 1000;
  for (const v of vehicles) {
    for (const view of VIEWS) {
      const el = view.vehEls.get(v.id);
      if (!el) continue;
      const pt = view.pointFor(v, now);
      if (!pt || pt[0] < -10 || pt[0] > view.boxW + 10 || pt[1] < -10 || pt[1] > view.boxH + 10) {
        el.setAttribute("opacity", "0"); continue;
      }
      el.setAttribute("cx", pt[0].toFixed(2));
      el.setAttribute("cy", pt[1].toFixed(2));
      el.setAttribute("opacity", "1");
    }
  }
}

function syncVehicles(list) {
  if (!mapData) return;
  const now = Date.now() / 1000;
  const keep = new Set();
  for (const v of list) {
    keep.add(v.id);
    const prev = vehSeg.get(v.id);
    if (prev && prev.next === v.next) v._seg = prev.seg;
    else v._seg = Math.max(v.seg_time || 90, v.next_arr - now);
    vehSeg.set(v.id, { next: v.next, seg: v._seg });
    const color = mapData.route_colors[v.route] || "#888";
    for (const view of VIEWS) {
      let el = view.vehEls.get(v.id);
      if (!el) { el = svgEl("circle", { r: view.trainR, class: "train-dot" }, view.trainsG); view.vehEls.set(v.id, el); }
      el.setAttribute("fill", color);
    }
  }
  for (const view of VIEWS) {
    for (const [id, el] of view.vehEls) {
      if (!keep.has(id)) { el.remove(); view.vehEls.delete(id); }
    }
  }
  for (const [id] of vehSeg) if (!keep.has(id)) vehSeg.delete(id);
  vehicles = list;
  animateTrains();
}

function badge(route, size) {
  return `<span class="line-badge line-${route}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.55)}px">${route}</span>`;
}

function renderStations(data) {
  document.getElementById("updated").textContent =
    "updated " + new Date(data.updated).toLocaleTimeString();
  document.getElementById("stations-panel").innerHTML = data.stations.map(s => {
    const chips = s.arrivals.slice(0, 5).map(a => {
      const gone   = a.arrives_in_min < s.walk_min;
      const urgent = !gone && a.arrives_in_min <= s.walk_min + 2;
      const cls    = gone ? "arrival-chip gone" : urgent ? "arrival-chip urgent" : "arrival-chip catchable";
      const pill   = gone
        ? '<span class="chip-pill pill-gone">gone</span>'
        : urgent ? '<span class="chip-pill pill-leave">NOW</span>'
                 : '<span class="chip-pill pill-catchable">ok</span>';
      const time = a.arrives_in_min <= 0
        ? `<span class="chip-time" style="font-size:0.85rem;color:#555">arr</span>`
        : `<span class="chip-time">${a.arrives_in_min}<span class="unit">m</span></span>`;
      return `<div class="${cls}">
        <div class="chip-icon">${badge(a.route,28)}<span class="chip-dir">${a.direction}</span></div>
        <div class="chip-end">${time}${pill}</div>
      </div>`;
    }).join("");
    return `<div class="station">
      <div class="station-left">
        <div class="station-meta">${s.lines.map(l => badge(l,28)).join("")}</div>
        <div class="station-name">${s.name}</div>
        <div class="station-meta">${s.walk_min} min walk</div>
      </div>
      <div class="arrivals-row">${chips || '<span style="color:#2a2a2a;font-size:0.85rem">no arrivals</span>'}</div>
    </div>`;
  }).join("");
}

// --- Schematic (octolinear) big map -----------------------------------------
async function setupSchematic(svgId, W, H) {
  const sj = await (await fetch("/static/schematic.json")).json();
  SCHEM.nodeXY = sj.nodes;
  SCHEM.spacing = 3.2;
  // Per-route polyline through schematic node positions, with arc-length params
  // so trains/stops ride the schematic line exactly like the geographic one.
  SCHEM.paths = {};
  for (const [rid, seq] of Object.entries(sj.routes)) {
    const ids = seq.filter(id => sj.nodes[id]);
    if (ids.length < 2) continue;
    const path = ids.map(id => sj.nodes[id]);
    const cum = [0];
    for (let i = 1; i < path.length; i++)
      cum.push(cum[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
    const total = cum[cum.length - 1] || 1;
    const ncum = cum.map(c => c / total);
    const stopT = {};
    ids.forEach((id, i) => { stopT[id] = ncum[i]; });
    SCHEM.paths[rid] = { path, cum: ncum, stopT };
  }
  SCHEM.stopOnLine = {};
  for (const [rid, rp] of Object.entries(SCHEM.paths))
    for (const id in rp.stopT)
      if (!SCHEM.stopOnLine[id]) SCHEM.stopOnLine[id] = { route: rid, s: rp.stopT[id] };

  // Fit node bbox into the box (y flipped: schematic y is north-up).
  const xs = Object.values(sj.nodes).map(p => p[0]), ys = Object.values(sj.nodes).map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const PAD = 34;
  const sc = Math.min((W - 2 * PAD) / (maxX - minX), (H - 2 * PAD) / (maxY - minY));
  const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;
  SCHEM.proj = p => [ox + (p[0] - minX) * sc, H - (oy + (p[1] - minY) * sc)];

  // station screen position, shifted onto its route's color-offset line
  function stopScreen(id) {
    const onL = SCHEM.stopOnLine[id];
    if (!onL) return SCHEM.proj(SCHEM.nodeXY[id]);
    const rp = SCHEM.paths[onL.route];
    let [x, y] = SCHEM.proj(sampleAlong(rp, onL.s));
    const slot = ROUTE_SLOT[onL.route] || 0;
    if (slot) {
      const [ax, ay] = SCHEM.proj(sampleAlong(rp, Math.min(1, onL.s + 0.004)));
      const tx = ax - x, ty = ay - y, l = Math.hypot(tx, ty) || 1, off = slot * SCHEM.spacing;
      x += (-ty / l) * off; y += (tx / l) * off;
    }
    return [x, y];
  }

  const svg = document.getElementById(svgId);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = "";
  svgEl("rect", { x: 0, y: 0, width: W, height: H, fill: "#0a141f" }, svg);

  const linesG = svgEl("g", {}, svg);
  for (const [rid, rp] of Object.entries(SCHEM.paths)) {
    const color = mapData.route_colors[rid] || "#888";
    const w = TRUNK.includes(rid) ? 5 : 3.5;
    const off = (ROUTE_SLOT[rid] || 0) * SCHEM.spacing;
    const pts = rp.path.map(p => SCHEM.proj(p));
    svgEl("path", { d: offsetPath(pts, off), class: "map-line", stroke: color, "stroke-width": w }, linesG);
  }

  const stopsG = svgEl("g", {}, svg);
  for (const id in SCHEM.nodeXY) {
    const [x, y] = stopScreen(id);
    if (YOUR_STOP_IDS.includes(id)) {
      const color = YOUR_STOP_COLORS[id] || "#fff";
      svgEl("circle", { cx: x, cy: y, r: 8, class: "your-stop", stroke: color }, stopsG);
      svgEl("circle", { cx: x, cy: y, r: 3.4, fill: color }, stopsG);
    } else {
      svgEl("circle", { cx: x, cy: y, r: 2.6, class: "map-stop" }, stopsG);
    }
  }

  // Home: pin to the nearest station's schematic position.
  let hb = null, hd = 1e9;
  for (const id in SCHEM.nodeXY) {
    const st = mapData.stopIndex[id];
    if (!st) continue;
    const dd = (st.lat - HOME.lat) ** 2 + (st.lon - HOME.lon) ** 2;
    if (dd < hd) { hd = dd; hb = id; }
  }
  if (hb) {
    const [hx, hy] = stopScreen(hb);
    svgEl("circle", { cx: hx, cy: hy, r: 13, class: "home-ring" }, svg);
  }

  const trainsG = svgEl("g", {}, svg);
  const view = { trainsG, vehEls: new Map(), boxW: W, boxH: H, trainR: 5 };
  view.pointFor = function (v, now) {                 // schematic train placement
    const rp = SCHEM.paths[v.route];
    if (!rp || rp.stopT[v.next] === undefined) return null;
    const ns = rp.stopT[v.next];
    const ps = (v.prev != null && rp.stopT[v.prev] !== undefined) ? rp.stopT[v.prev] : ns;
    let f = 1 - (v.next_arr - now) / (v._seg || v.seg_time || 90);
    f = Math.max(0, Math.min(1, f));
    const s = ps + f * (ns - ps);
    let [x, y] = SCHEM.proj(sampleAlong(rp, s));
    const slot = ROUTE_SLOT[v.route] || 0;
    if (slot) {
      const [ax, ay] = SCHEM.proj(sampleAlong(rp, Math.min(1, s + 0.004)));
      const tx = ax - x, ty = ay - y, l = Math.hypot(tx, ty) || 1, off = slot * SCHEM.spacing;
      x += (-ty / l) * off; y += (tx / l) * off;
    }
    return [x, y];
  };
  VIEWS.push(view);
}

async function fetchStations() {
  try { renderStations(await (await fetch("/api/stations")).json()); }
  catch(e) { document.getElementById("updated").textContent = "error"; }
}
async function fetchVehicles() {
  try { syncVehicles((await (await fetch("/api/vehicles")).json()).vehicles); }
  catch(e) {}
}

async function init() {
  mapData = await (await fetch("/static/map_data.json")).json();
  mapData.stopIndex = Object.fromEntries(mapData.stops.map(s => [s.id, s]));
  // Offset by COLOR (not per route): same-color routes share a slot and stack
  // into one line; different colors get different slots and fan out where they
  // share track. Slots centered around 0.
  const colors = [...new Set(Object.values(mapData.route_colors))];
  const colorSlot = {};
  colors.forEach((c, i) => { colorSlot[c] = i - (colors.length - 1) / 2; });
  for (const id of Object.keys(mapData.route_paths)) {
    ROUTE_SLOT[id] = colorSlot[mapData.route_colors[id]] || 0;
  }
  // Map each stop to a drawn line so its dot can sit on the offset line.
  for (const [routeId, rp] of Object.entries(mapData.route_paths)) {
    for (const sid in rp.stopT) {
      if (!STOP_ON_LINE[sid]) STOP_ON_LINE[sid] = { route: routeId, s: rp.stopT[sid] };
    }
  }
  // Big map: schematic (octolinear) diagram.
  await setupSchematic("city-svg", 1120, 1080);
  setupView("area-svg", AREA_ROI, 800, 330, { labels: false, stopLabels: true, lineScale: 1.9, stopR: 4, yourR: 12, trainR: 7, homeR: 17, pad: 20 });
  await fetchStations();
  await fetchVehicles();
}

init();
setInterval(fetchStations, 30000);
setInterval(fetchVehicles, 30000);
setInterval(animateTrains, 50);
</script>
