<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NYC Subway</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a1826; color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    width: 1920px; height: 1080px;
    overflow: hidden; position: relative;
  }
  /* Big map fills the whole screen; two small windows float on top. */
  #left { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #right { display: contents; }
  .floatwin { position: absolute; z-index: 5; border-radius: 14px; overflow: hidden;
              background: rgba(8, 13, 20, 0.92); border: 1px solid #24384a;
              box-shadow: 0 10px 34px rgba(0, 0, 0, 0.6); }
  /* Square nearby-stops map, top-right */
  #area-wrap { top: 24px; right: 24px; width: 380px; height: 380px; }
  /* Timetable (no window bg; the station cards are translucent) */
  #bottom { position: absolute; right: 24px; bottom: 24px; width: 840px; height: 648px; z-index: 5;
            display: flex; flex-direction: column; padding: 16px 20px; }

  .map-label { position: absolute; top: 16px; left: 22px; font-size: 0.78rem;
               color: #3d5260; letter-spacing: 3px; text-transform: uppercase; z-index: 2; }
  svg { display: block; }

  /* Clock overlaid on the top-left of the big map */
  #clock { position: absolute; top: 26px; left: 28px; z-index: 2;
           font-size: 4.4rem; font-weight: 200; letter-spacing: 6px; line-height: 1;
           color: #eaf2f7; text-shadow: 0 2px 14px #000; }
  #clock-date { position: absolute; top: 108px; left: 30px; z-index: 2;
                font-size: 0.95rem; color: #5a6b76; letter-spacing: 2px; }
  #bottom-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  #address { font-size: 1.05rem; color: #6a7b86; }
  #updated { font-size: 0.74rem; color: #34454f; }

  .stations-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .station {
    background: rgba(14, 28, 38, 0.5); border-radius: 12px; padding: 10px 16px;
    border: 1px solid #1b2c38; display: flex; gap: 18px; align-items: center;
    flex: 1; min-height: 0;
  }
  .station-left { flex-shrink: 0; width: 104px; }
  .station-name { font-size: 1rem; font-weight: 500; margin-bottom: 4px; }
  .station-meta { font-size: 0.74rem; color: #444; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .line-badge { border-radius: 50%; display: inline-flex; align-items: center;
                justify-content: center; font-weight: 700; flex-shrink: 0; }
  .line-L { background: #7c858c; color: #000; }
  .line-G { background: #799534; color: #fff; }
  .line-J, .line-Z { background: #8e5c33; color: #fff; }
  .line-M { background: #eb6800; color: #fff; }
  .line-A, .line-C, .line-E { background: #0062cf; color: #fff; }
  .line-B, .line-D, .line-F { background: #eb6800; color: #fff; }
  .line-N, .line-Q, .line-R, .line-W { background: #f6bc26; color: #000; }
  .line-1, .line-2, .line-3 { background: #d82233; color: #fff; }
  .line-4, .line-5, .line-6 { background: #009952; color: #fff; }
  .line-7 { background: #9a38a1; color: #fff; }
  .arrivals-row { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .arrival-chip { display: flex; align-items: center; justify-content: space-between; gap: 7px;
                  padding: 7px 10px; border-radius: 9px; background: #0a141b; border: 1px solid #1b2c38;
                  width: 140px; }
  .arrival-chip.gone      { opacity: 0.25; }
  .arrival-chip.catchable { border-color: #1e3a1e; }
  .arrival-chip.urgent    { border-color: #4a3a00; background: #0f0c00; }
  .chip-icon { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .chip-dir { font-size: 0.82rem; color: #c2ccd2; font-weight: 600; line-height: 1.1; text-align: center;
              max-width: 78px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .chip-time { font-size: 1.5rem; font-weight: 200; line-height: 1; min-width: 34px; text-align: right; }
  .chip-time .unit { font-size: 0.6rem; color: #555; }
  .chip-pill { font-size: 0.56rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
  .pill-gone      { background: #1a1a1a; color: #333; }
  .pill-leave     { background: #4a3a00; color: #fccc0a; }
  .pill-catchable { background: #1a3a1a; color: #6cbe45; }

  .map-line  { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .map-stop  { fill: #e6ebee; stroke: none; }
  .your-stop { fill: none; stroke-width: 3; }
  .home-ring { fill: none; stroke: #fff; stroke-width: 1.5; opacity: 0.6; }
  .train-dot { stroke: rgba(0,0,0,0.55); stroke-width: 1; }
  .boro-land { fill: #1b222b; stroke: #2a333d; stroke-width: 1; }
  .boro-label { fill: #3a4854; font-weight: 700; text-anchor: middle; letter-spacing: 3px; }
  .stop-label { fill: #eaf2f7; font-size: 18px; font-weight: 600; letter-spacing: 0.3px;
                paint-order: stroke; stroke: #0a1826; stroke-width: 3.5px; }
  /* Debug tuning panel (press D to toggle) */
  #debug { display: none; position: fixed; top: 8px; right: 8px; width: 260px; max-height: 96vh; overflow: auto;
           z-index: 50; background: rgba(4,10,16,0.9); border: 1px solid #2a3f4f; border-radius: 8px;
           padding: 8px 10px; font-size: 11px; color: #b9c6cf; }
  #debug .drow { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #debug label { width: 52px; flex-shrink: 0; color: #7f94a2; }
  #debug input[type=range] { flex: 1; min-width: 0; }
  #debug span { width: 52px; flex-shrink: 0; text-align: right; color: #8fdcb0; }
  #debug textarea { width: 100%; height: 70px; margin-top: 8px; font-size: 10px; resize: vertical;
                    background: #06101a; color: #8fdcb0; border: 1px solid #2a3f4f; border-radius: 4px; }
</style>
</head>
<body>
  <div id="debug"></div>
  <div id="left">
    <div id="clock">--:--:--</div>
    <div id="clock-date">NEW YORK CITY · LIVE</div>
    <svg id="city-svg"></svg>
  </div>
  <div id="right">
    <div id="area-wrap" class="floatwin"><div class="map-label">Local stops</div><svg id="area-svg"></svg></div>
    <div id="bottom">
      <div id="bottom-head">
        <div id="address">114 Leonard St, Brooklyn</div>
        <div id="updated">--</div>
      </div>
      <div class="stations-panel" id="stations-panel"><div style="color:#222">loading...</div></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.6/dist/protobuf.min.js"></script>
<script src="config.js"></script>
<script src="feeds.js"></script>
<script>
const HOME = { lat: 40.70742, lon: -73.94640 };
const YOUR_STOP_IDS = ["L10", "G29", "M14", "L13", "G30"];
const YOUR_STOP_COLORS = { "L10": "#7c858c", "G29": "#799534", "M14": "#eb6800", "L13": "#7c858c", "G30": "#799534" };
// Names to label on the local map (the stations you actually use)
const STATION_LABELS = { "L10": "Lorimer St", "M14": "Hewes St", "L13": "Montrose Av", "G30": "Broadway" };

// Region of interest for each map. drawn to fill its box (no letterbox).
const CITY_ROI = { min_lat: 40.600, max_lat: 40.794, min_lon: -73.946, max_lon: -73.905 };
// UI image-crop of the rendered city map (fractions cut from each edge; zoom-to-fill).
const CITY_CROP = { l: 0.0, r: 0.0, t: 0.0, b: 0.0 };
// City map projection options (tunable live via the debug panel — press D).
const CITY_OPTS = {
  rotate: 29, warp: true, alignLeft: true, leftGap: 48, labels: true, labelSize: 36, stopR: 2.2, yourR: 8, trainR: 5, homeR: 13,
  // Stretch bands in post-rotation x/y (x = horizontal, y = vertical/up). Each axis
  // expands two bands and compresses the gap between (G) and outside (C).
  Ex: 2.45, Gx: 0.7, Cx: 0.55, x0: -5, x1: 13.5, x2: 33, x3: 50,  // Manhattan | river | Bklyn jct
  Ey: 1.7, Cy: 0.62, Gy: 0.55, y0: -55, y1: -18, y2: 1, y3: 19,   // FiDi | gap | midtown
};
// Square area centered on home (equal-distance lat/lon so it fills the square window).
const AREA_ROI = { min_lat: 40.6944, max_lat: 40.7204, min_lon: -73.9636, max_lon: -73.9292 };

const TRUNK = ["1","2","3","4","5","6","7","A","C","E","N","Q","R","W","L"];
const ROUTE_SLOT = {};   // routeId -> offset slot, so overlapping colors fan out
const STOP_ON_LINE = {}; // stopId -> {route, s}: where the stop sits on a drawn line
let mapData = null;
let vehicles = [];
const vehSeg = new Map();   // trip id -> {next, seg}: locked segment duration
const VIEWS = [];           // each: {proj, trainsG, vehEls, boxW, boxH, trainR}
const GRID = {};            // draggable warp grid: {sx, sy, tx, ty}
let cityProj = null;        // last city-map projection (for grid drag math)
let gridOn = false;         // tuning grid overlay off by default (abracadabra() toggles)
let freezeCityFit = false;  // during a grid drag, keep the projection fixed (no re-fit jump)

function pad(n) { return String(n).padStart(2, "0"); }
function tick() {
  const d = new Date();
  document.getElementById("clock").textContent =
    pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  const DW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  document.getElementById("clock-date").textContent = DW[d.getDay()] + " · " + MO[d.getMonth()] + " " + d.getDate();
}
setInterval(tick, 1000); tick();

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}

function project(p, lat, lon) {
  const [lx, ly] = localXform(p, lat, lon);
  return [p.bx + (lx - p.midX) * p.scale, p.by - (ly - p.midY) * p.scale];
}

// Piecewise-linear stretch of one axis: widen the band [L,R] by E (around mc),
// compress outside it by C. Keeps lines straight (only a kink at a band edge).
function stretch1(v, L, R, mc, E, C, w) {
  if (!E || E === 1) return v;
  if (!w || w <= 1e-9) {                              // hard piecewise (sharp kinks)
    if (v > R) return mc + E * (R - mc) + C * (v - R);
    if (v < L) return mc + E * (L - mc) + C * (v - L);
    return mc + E * (v - mc);
  }
  // Smooth (C1) transition of width w at each band edge -> lines bend gently
  // across the shoreline instead of a sharp jog.
  w = Math.min(w, (R - L) * 0.9);
  const hw = w / 2;
  if (v >= mc) {
    const Rin = R - hw, Rout = R + hw;
    if (v <= Rin) return mc + E * (v - mc);
    if (v <= Rout) { const x = v - Rin; return mc + E * (Rin - mc) + E * x + (C - E) * x * x / (2 * w); }
    return mc + E * (Rin - mc) + w * (E + C) / 2 + C * (v - Rout);
  }
  const Lin = L + hw, Lout = L - hw;
  if (v >= Lin) return mc + E * (v - mc);
  if (v >= Lout) { const x = Lin - v; return mc + E * (Lin - mc) - E * x - (C - E) * x * x / (2 * w); }
  return mc + E * (Lin - mc) - w * (E + C) / 2 - C * (Lout - v);
}

// Multi-band scale along one axis (b0<b1<b2<b3): density C outside, E in the two
// bands [b0,b1] and [b2,b3], G in the gap [b1,b2]. Used for both axes — e.g. on x,
// expand Manhattan and the Brooklyn junction, compress the river between.
function stretchMB(v, b0, b1, b2, b3, E, G, C) {
  let p;
  if (v < b0) p = C * (v - b0);
  else if (v <= b1) p = E * (v - b0);
  else if (v <= b2) p = E * (b1 - b0) + G * (v - b1);
  else if (v <= b3) p = E * (b1 - b0) + G * (b2 - b1) + E * (v - b2);
  else p = E * (b1 - b0) + G * (b2 - b1) + E * (b3 - b2) + C * (v - b3);
  return b0 + p;
}

// Fixed rotation origin so the x/y band coords below are absolute (independent
// of the crop). After rotation, x = horizontal on screen, y = vertical (up).
// Units are ~PSCALE per degree (a few tens across Manhattan).
const REF_LAT = 40.75, REF_LON = -73.99;
const REF_COSLAT = Math.cos(REF_LAT * Math.PI / 180), PSCALE = 1000;

// (lat,lon) -> rotated x/y, then stretch x (widen Manhattan, squeeze rivers) and
// y (expand the dense FiDi & midtown bands, shrink the low-traffic gap between).
// Box scale applied in project().
function localXform(p, lat, lon) {
  const ex = (lon - REF_LON) * REF_COSLAT;
  const ny = (lat - REF_LAT);
  let rx = (ex * p.cosT - ny * p.sinT) * PSCALE;
  let ry = (ex * p.sinT + ny * p.cosT) * PSCALE;
  if (p.warp && GRID.tx) { rx = warp1(rx, GRID.sx, GRID.tx); ry = warp1(ry, GRID.sy, GRID.ty); }
  return [rx, ry];
}

function buildProj(roi, boxW, boxH, pad, o) {
  o = o || {};
  const cLat = (roi.min_lat + roi.max_lat) / 2;
  const cLon = (roi.min_lon + roi.max_lon) / 2;
  const cosLat = Math.cos(cLat * Math.PI / 180);
  const innerW = boxW - pad * 2, innerH = boxH - pad * 2;
  let latSpan = roi.max_lat - roi.min_lat;
  let lonSpan = roi.max_lon - roi.min_lon;
  const boxAspect = innerW / innerH;
  if ((lonSpan * cosLat) / latSpan < boxAspect) lonSpan = latSpan * boxAspect / cosLat;
  else latSpan = lonSpan * cosLat / boxAspect;
  const NLAT = cLat - latSpan / 2, XLAT = cLat + latSpan / 2;
  const NLON = cLon - lonSpan / 2, XLON = cLon + lonSpan / 2;

  const T = (o.rotate || 0) * Math.PI / 180;
  const p = { cosT: Math.cos(T), sinT: Math.sin(T), warp: !!o.warp };
  // Fit the transformed window into the box by sampling a grid.
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const N = 12;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const [lx, ly] = localXform(p, NLAT + (XLAT - NLAT) * i / N, NLON + (XLON - NLON) * j / N);
    if (lx < minX) minX = lx; if (lx > maxX) maxX = lx;
    if (ly < minY) minY = ly; if (ly > maxY) maxY = ly;
  }
  p.midX = (minX + maxX) / 2; p.midY = (minY + maxY) / 2;
  if (o.alignLeft) {                                  // fill height, left edge + gap
    p.scale = innerH / ((maxY - minY) || 1e-9);
    p.bx = pad + (o.leftGap || 0) + (p.midX - minX) * p.scale;
    p.by = boxH / 2;
  } else {
    p.scale = Math.min(innerW / ((maxX - minX) || 1e-9), innerH / ((maxY - minY) || 1e-9));
    p.bx = boxW / 2; p.by = boxH / 2;
  }
  return p;
}

// --- Draggable grid warp -----------------------------------------------------
// Separable piecewise-linear map: source gridline positions sx/sy (rotated
// coords) map to target positions tx/ty. Drag a gridline to stretch/squeeze the
// rows/columns. Vertical lines stay vertical, horizontal stay horizontal.
function warp1(v, s, t) {
  const n = s.length;
  // Clamp past the ends: content beyond the outermost gridline collapses onto it,
  // so dragging an edge gridline actually pulls that edge of the map in/out.
  if (v <= s[0]) return t[0];
  if (v >= s[n - 1]) return t[n - 1];
  for (let i = 0; i < n - 1; i++)
    if (v <= s[i + 1]) return t[i] + (v - s[i]) * (t[i + 1] - t[i]) / ((s[i + 1] - s[i]) || 1e-9);
  return t[n - 1];
}

function initGrid() {
  // Baked hand-tuned warp grid (post-rotation x/y at rotate=29, full-screen layout).
  GRID.sx = [-12.26, -3.93, 1.86, 9.88, 26.38, 57.37, 138.38, 268.96];
  GRID.tx = [-12.1, -1.54, 36.26, 91.09, 123.1, 191.89, 330.15, 512.04];
  GRID.sy = [-150.03, -58.34, -21.82, 13.44, 23.57, 39.04, 110.52, 185.12];
  GRID.ty = [-192.59, -127.89, -30.83, 21.27, 59.07, 75.76, 136.05, 185.12];
}

function drawGrid() {
  const svg = document.getElementById("city-svg");
  const old = document.getElementById("gridlayer");
  if (old) old.remove();
  if (!gridOn || !cityProj || !GRID.tx) return;
  const g = svgEl("g", { id: "gridlayer" }, svg);
  const p = cityProj, W = 1920, H = 1080;
  const toX = v => p.bx + (v - p.midX) * p.scale;
  const toY = v => p.by - (v - p.midY) * p.scale;
  // Blue line = warp position (drag to stretch). Orange box = source cutoff
  // (drag to slide which geography this seam sits on). Connector shows the map.
  GRID.tx.forEach((tx, i) => {
    const Xt = toX(tx), Xs = toX(GRID.sx[i]), stag = (i % 2) * 20, hy = H - 24 - stag;
    svgEl("line", { x1: Xt, y1: 0, x2: Xt, y2: H, stroke: "#3aa0e0", "stroke-width": 1.2, opacity: 0.6 }, g);
    const hit = svgEl("line", { x1: Xt, y1: 0, x2: Xt, y2: H, stroke: "rgba(0,0,0,0.01)", "stroke-width": 16, style: "cursor:ew-resize" }, g);
    hit.addEventListener("mousedown", e => startGridDrag(e, "x", i, "target"));
    svgEl("line", { x1: Xs, y1: hy + 8, x2: Xt, y2: H, stroke: "#e0a83a", "stroke-width": 1, opacity: 0.4 }, g);
    const box = svgEl("rect", { x: Xs - 8, y: hy, width: 16, height: 16, rx: 3, fill: "#e0a83a", stroke: "#0a1826", style: "cursor:ew-resize" }, g);
    box.addEventListener("mousedown", e => startGridDrag(e, "x", i, "source"));
  });
  GRID.ty.forEach((ty, i) => {
    const Yt = toY(ty), Ys = toY(GRID.sy[i]), stag = (i % 2) * 20, hx = 3 + stag;
    svgEl("line", { x1: 0, y1: Yt, x2: W, y2: Yt, stroke: "#3aa0e0", "stroke-width": 1.2, opacity: 0.6 }, g);
    const hit = svgEl("line", { x1: 0, y1: Yt, x2: W, y2: Yt, stroke: "rgba(0,0,0,0.01)", "stroke-width": 16, style: "cursor:ns-resize" }, g);
    hit.addEventListener("mousedown", e => startGridDrag(e, "y", i, "target"));
    svgEl("line", { x1: hx + 8, y1: Ys, x2: 0, y2: Yt, stroke: "#e0a83a", "stroke-width": 1, opacity: 0.4 }, g);
    const box = svgEl("rect", { x: hx, y: Ys - 8, width: 16, height: 16, rx: 3, fill: "#e0a83a", stroke: "#0a1826", style: "cursor:ns-resize" }, g);
    box.addEventListener("mousedown", e => startGridDrag(e, "y", i, "source"));
  });
}

// Toggle the tuning grid + debug panel. Exposed as abracadabra() in the console.
function toggleGrid() {
  gridOn = !gridOn;
  const panel = document.getElementById("debug");
  if (panel) panel.style.display = gridOn ? "block" : "none";
  drawGrid();
}
window.abracadabra = toggleGrid;

// Toggle the right popups (local map + timetable). Press P or call popup().
function togglePopup() {
  const r = document.getElementById("right");
  r.style.display = (r.style.display === "none") ? "contents" : "none";
}
window.popup = togglePopup;

function startGridDrag(e, axis, i, mode) {
  e.preventDefault();
  const svg = document.getElementById("city-svg"), W = 1920, H = 1080;
  const arr = mode === "source" ? (axis === "x" ? GRID.sx : GRID.sy) : (axis === "x" ? GRID.tx : GRID.ty);
  freezeCityFit = true;   // keep the projection fixed so the line tracks the cursor
  const move = ev => {
    // Map mouse -> logical SVG coords via the real CTM (robust to the viewBox crop).
    const sp = svg.createSVGPoint(); sp.x = ev.clientX; sp.y = ev.clientY;
    const loc = sp.matrixTransform(svg.getScreenCTM().inverse());
    let val;
    if (axis === "x") val = (loc.x - cityProj.bx) / cityProj.scale + cityProj.midX;
    else val = cityProj.midY - (loc.y - cityProj.by) / cityProj.scale;
    const lo = i > 0 ? arr[i - 1] + 1 : -1e6, hi = i < arr.length - 1 ? arr[i + 1] - 1 : 1e6;
    arr[i] = +Math.max(lo, Math.min(hi, val)).toFixed(2);
    setupView("city-svg", CITY_ROI, 1920, 1080, CITY_OPTS);   // redraw map (updates cityProj)
    drawGrid();
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    freezeCityFit = false;
    setupView("city-svg", CITY_ROI, 1920, 1080, CITY_OPTS);   // re-fit once, on release
    drawGrid();
    syncVehicles(vehicles);
    if (typeof updateDebugReadout === "function") updateDebugReadout();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}

// Build an SVG path for a projected polyline, shifted perpendicular by `off` px
// so routes sharing the same track render as parallel colored lines.
function offsetPath(pts, off) {
  let d = "";
  for (let i = 0; i < pts.length; i++) {
    let x = pts[i][0], y = pts[i][1];
    if (off !== 0) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const len = Math.hypot(tx, ty) || 1;
      x += (-ty / len) * off;
      y += (tx / len) * off;
    }
    d += (i ? " L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
  }
  return d;
}

// Screen position of a stop, placed on its route's color-offset line (so the
// dot sits on the line, not on the un-offset true coordinate). Falls back to
// the raw coordinate for stops not on any drawn trunk.
function stopPx(proj, ls, stop) {
  const info = STOP_ON_LINE[stop.id];
  if (!info) return project(proj, stop.lat, stop.lon);
  const rp = mapData.route_paths[info.route];
  let [x, y] = project(proj, ...sampleAlong(rp, info.s));
  const slot = ROUTE_SLOT[info.route] || 0;
  if (slot) {
    const [ax, ay] = project(proj, ...sampleAlong(rp, Math.min(1, info.s + 0.003)));
    const tx = ax - x, ty = ay - y, len = Math.hypot(tx, ty) || 1;
    const off = slot * 1.8 * ls;
    x += (-ty / len) * off; y += (tx / len) * off;
  }
  return [x, y];
}

function sampleAlong(rp, s) {
  s = Math.max(0, Math.min(1, s));
  const cum = rp.cum, path = rp.path;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m + 1; else hi = m; }
  const i = Math.max(1, lo);
  const seg = (cum[i] - cum[i - 1]) || 1e-9;
  const f = (s - cum[i - 1]) / seg;
  return [
    path[i - 1][0] + f * (path[i][0] - path[i - 1][0]),
    path[i - 1][1] + f * (path[i][1] - path[i - 1][1]),
  ];
}

function setupView(svgId, roi, boxW, boxH, opts) {
  const svg = document.getElementById(svgId);
  if (svgId === "city-svg") {        // UI image-crop (zoom-to-fill) of the rendered map
    const c = CITY_CROP;
    svg.setAttribute("viewBox", `${c.l * boxW} ${c.t * boxH} ${(1 - c.l - c.r) * boxW} ${(1 - c.t - c.b) * boxH}`);
    svg.setAttribute("preserveAspectRatio", "xMinYMid slice");  // fill screen, left-aligned
  } else {
    svg.setAttribute("viewBox", `0 0 ${boxW} ${boxH}`);
  }
  svg.setAttribute("width", boxW); svg.setAttribute("height", boxH);
  svg.innerHTML = "";
  const proj = (svgId === "city-svg" && freezeCityFit && cityProj)
    ? cityProj : buildProj(roi, boxW, boxH, opts.pad ?? 22, opts);
  if (svgId === "city-svg") cityProj = proj;
  const cull = (x, y) => x < -30 || x > boxW + 30 || y < -30 || y > boxH + 30;

  svgEl("rect", { x: 0, y: 0, width: boxW, height: boxH, fill: "#080a0d" }, svg); // water (near-black)

  const landG = svgEl("g", {}, svg);
  for (const b of (mapData.boroughs || [])) {
    for (const ring of b.rings) {
      const d = ring.map(([lat, lon], i) => {
        const [x, y] = project(proj, lat, lon);
        return (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      }).join(" ") + " Z";
      svgEl("path", { d, class: "boro-land" }, landG);
    }
  }
  if (opts.labels) {
    for (const b of (mapData.boroughs || [])) {
      const [x, y] = project(proj, b.label[0], b.label[1]);
      if (cull(x, y)) continue;
      const t = svgEl("text", { x, y, class: "boro-label", "font-size": opts.labelSize || 36 }, svg);
      t.textContent = b.name.toUpperCase();
    }
  }

  // One clean line per route (its trunk), offset perpendicular by color so only
  // different-colored routes fan apart; same-color routes stack into one line.
  const linesG = svgEl("g", {}, svg);
  const ls = opts.lineScale || 1;
  const spacing = 1.8 * ls;
  for (const [routeId, rp] of Object.entries(mapData.route_paths)) {
    if (!rp.path || rp.path.length < 2) continue;
    const color = mapData.route_colors[routeId] || "#444";
    const w = (TRUNK.includes(routeId) ? 3.8 : 2.8) * ls;
    const off = (ROUTE_SLOT[routeId] || 0) * spacing;
    const pts = rp.path.map(([lat, lon]) => project(proj, lat, lon));
    svgEl("path", { d: offsetPath(pts, off), class: "map-line", stroke: color, "stroke-width": w }, linesG);
  }

  const stopsG = svgEl("g", {}, svg);
  for (const stop of mapData.stops) {
    const [x, y] = stopPx(proj, ls, stop);
    if (cull(x, y)) continue;
    if (YOUR_STOP_IDS.includes(stop.id)) {
      const color = YOUR_STOP_COLORS[stop.id] || "#fff";
      svgEl("circle", { cx: x, cy: y, r: (opts.yourR || 8), class: "your-stop", stroke: color }, stopsG);
      svgEl("circle", { cx: x, cy: y, r: (opts.yourR || 8) * 0.42, fill: color }, stopsG);
    } else {
      svgEl("circle", { cx: x, cy: y, r: opts.stopR || 2, class: "map-stop" }, stopsG);
    }
  }

  const [hx, hy] = project(proj, HOME.lat, HOME.lon);
  svgEl("circle", { cx: hx, cy: hy, r: opts.homeR || 13, class: "home-ring" }, svg);
  svgEl("circle", { cx: hx, cy: hy, r: (opts.homeR || 13) * 0.36, fill: "#fff" }, svg);

  const gf = svgEl("filter", { id: svgId + "-glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, svgEl("defs", {}, svg));
  svgEl("feGaussianBlur", { stdDeviation: 2, result: "b" }, gf);
  const gm = svgEl("feMerge", {}, gf);
  svgEl("feMergeNode", { in: "b" }, gm);
  svgEl("feMergeNode", { in: "SourceGraphic" }, gm);
  const trainsG = svgEl("g", { filter: "url(#" + svgId + "-glow)" }, svg);

  if (opts.stopLabels) {
    for (const stop of mapData.stops) {
      const name = STATION_LABELS[stop.id];
      if (!name) continue;
      const [x, y] = stopPx(proj, ls, stop);
      const t = svgEl("text", { x: x + 13, y: y + 6, class: "stop-label" }, svg);
      t.textContent = name;
    }
  }

  for (let i = VIEWS.length - 1; i >= 0; i--) if (VIEWS[i].svgId === svgId) VIEWS.splice(i, 1);
  VIEWS.push({ svgId, proj, trainsG, vehEls: new Map(), boxW, boxH, trainR: opts.trainR || 5.5, lineScale: opts.lineScale || 1 });
}

// Returns the train's position on its route path plus a point just ahead (for
// tangent), so animateTrains can shift it onto the same color-offset line.
function trainLatLon(v, now) {
  const rp = mapData.route_paths[v.route];
  if (rp && rp.stopT[v.next] !== undefined) {
    const ns = rp.stopT[v.next];
    const ps = (v.prev != null && rp.stopT[v.prev] !== undefined) ? rp.stopT[v.prev] : ns;
    let frac = 1 - (v.next_arr - now) / (v._seg || v.seg_time || 90);
    frac = Math.max(0, Math.min(1, frac));
    const s = ps + frac * (ns - ps);
    return { pt: sampleAlong(rp, s), ahead: sampleAlong(rp, Math.min(1, s + 0.003)) };
  }
  return null;  // stop isn't on the drawn trunk (a branch) -> hide, no floating dot
}

function animateTrains() {
  if (!mapData) return;
  const now = Date.now() / 1000;
  for (const v of vehicles) {
    const info = trainLatLon(v, now);
    const slot = ROUTE_SLOT[v.route] || 0;
    for (const view of VIEWS) {
      const el = view.vehEls.get(v.id);
      if (!el) continue;
      if (!info) { el.setAttribute("opacity", "0"); continue; }
      let [x, y] = project(view.proj, info.pt[0], info.pt[1]);
      // Shift onto this route's color-offset line (match offsetPath spacing).
      if (slot !== 0 && info.ahead) {
        const [ax, ay] = project(view.proj, info.ahead[0], info.ahead[1]);
        let tx = ax - x, ty = ay - y;
        const len = Math.hypot(tx, ty) || 1;
        const off = slot * 1.8 * (view.lineScale || 1);
        x += (-ty / len) * off;
        y += (tx / len) * off;
      }
      if (x < -10 || x > view.boxW + 10 || y < -10 || y > view.boxH + 10) {
        el.setAttribute("opacity", "0"); continue;
      }
      el.setAttribute("cx", x.toFixed(2));
      el.setAttribute("cy", y.toFixed(2));
      el.setAttribute("opacity", "1");
    }
  }
}

function syncVehicles(list) {
  if (!mapData) return;
  const now = Date.now() / 1000;
  const keep = new Set();
  for (const v of list) {
    keep.add(v.id);
    const prev = vehSeg.get(v.id);
    if (prev && prev.next === v.next) v._seg = prev.seg;
    else v._seg = Math.max(v.seg_time || 90, v.next_arr - now);
    vehSeg.set(v.id, { next: v.next, seg: v._seg });
    const color = mapData.route_colors[v.route] || "#888";
    for (const view of VIEWS) {
      let el = view.vehEls.get(v.id);
      if (!el) { el = svgEl("circle", { r: view.trainR, class: "train-dot" }, view.trainsG); view.vehEls.set(v.id, el); }
      el.setAttribute("fill", color);
    }
  }
  for (const view of VIEWS) {
    for (const [id, el] of view.vehEls) {
      if (!keep.has(id)) { el.remove(); view.vehEls.delete(id); }
    }
  }
  for (const [id] of vehSeg) if (!keep.has(id)) vehSeg.delete(id);
  vehicles = list;
  animateTrains();
}

function badge(route, size) {
  return `<span class="line-badge line-${route}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.55)}px">${route}</span>`;
}

function renderStations(data) {
  document.getElementById("updated").textContent =
    "updated " + new Date(data.updated).toLocaleTimeString();
  document.getElementById("stations-panel").innerHTML = data.stations.map(s => {
    const chips = s.arrivals.slice(0, 8).map(a => {
      const gone   = a.arrives_in_min < s.walk_min;
      const urgent = !gone && a.arrives_in_min <= s.walk_min + 2;
      const cls    = gone ? "arrival-chip gone" : urgent ? "arrival-chip urgent" : "arrival-chip catchable";
      const pill   = gone
        ? '<span class="chip-pill pill-gone">gone</span>'
        : urgent ? '<span class="chip-pill pill-leave">NOW</span>'
                 : '<span class="chip-pill pill-catchable">ok</span>';
      const time = a.arrives_in_min <= 0
        ? `<span class="chip-time" style="font-size:0.85rem;color:#555">arr</span>`
        : `<span class="chip-time">${a.arrives_in_min}<span class="unit">m</span></span>`;
      return `<div class="${cls}">
        <div class="chip-icon">${badge(a.route,28)}<span class="chip-dir">${a.direction}</span></div>
        <div class="chip-end">${time}${pill}</div>
      </div>`;
    }).join("");
    return `<div class="station">
      <div class="station-left">
        <div class="station-meta">${s.lines.map(l => badge(l,28)).join("")}</div>
        <div class="station-name">${s.name}</div>
        <div class="station-meta">${s.walk_min} min walk</div>
      </div>
      <div class="arrivals-row">${chips || '<span style="color:#2a2a2a;font-size:0.85rem">no arrivals</span>'}</div>
    </div>`;
  }).join("");
}

// One fetch of all MTA feeds (client-side, no server) feeds both panels.
async function refreshLive() {
  try {
    const data = await MTA.refresh();
    renderStations(MTA.stationsView(data));
    syncVehicles(data.vehicles);
  } catch(e) {
    console.warn(e);
    document.getElementById("updated").textContent = "error";
  }
}

async function init() {
  mapData = await (await fetch("map_data.json")).json();
  mapData.stopIndex = Object.fromEntries(mapData.stops.map(s => [s.id, s]));
  // Offset by COLOR (not per route): same-color routes share a slot and stack
  // into one line; different colors get different slots and fan out where they
  // share track. Slots centered around 0.
  const colors = [...new Set(Object.values(mapData.route_colors))];
  const colorSlot = {};
  colors.forEach((c, i) => { colorSlot[c] = i - (colors.length - 1) / 2; });
  for (const id of Object.keys(mapData.route_paths)) {
    ROUTE_SLOT[id] = colorSlot[mapData.route_colors[id]] || 0;
  }
  // Map each stop to a drawn line so its dot can sit on the offset line.
  for (const [routeId, rp] of Object.entries(mapData.route_paths)) {
    for (const sid in rp.stopT) {
      if (!STOP_ON_LINE[sid]) STOP_ON_LINE[sid] = { route: routeId, s: rp.stopT[sid] };
    }
  }
  initGrid();
  setupView("city-svg", CITY_ROI, 1920, 1080, CITY_OPTS);
  setupView("area-svg", AREA_ROI, 380, 380, { labels: false, stopLabels: true, lineScale: 1.9, stopR: 4, yourR: 12, trainR: 7, homeR: 17, pad: 20 });
  drawGrid();
  buildDebug();
  await refreshLive();
}

// Redraw just the city map from the current CITY_OPTS/CITY_ROI (debug tuning).
function rebuildCity() {
  setupView("city-svg", CITY_ROI, 1920, 1080, CITY_OPTS);
  syncVehicles(vehicles);
  drawGrid();
}

// Live tuning panel. Drag the blue gridlines on the map to stretch rows/cols.
// Press D to toggle. Readout has the grid + crop to copy back.
let updateDebugReadout = () => {};
function buildDebug() {
  const T = [
    ["rotate", CITY_OPTS, 0, 45, 1],
    ["min_lon", CITY_ROI, -74.05, -73.84, 0.002], ["max_lon", CITY_ROI, -74.0, -73.78, 0.002],
    ["min_lat", CITY_ROI, 40.60, 40.74, 0.002], ["max_lat", CITY_ROI, 40.74, 40.92, 0.002],
    ["l", CITY_CROP, 0, 0.4, 0.01], ["r", CITY_CROP, 0, 0.4, 0.01],
    ["t", CITY_CROP, 0, 0.4, 0.01], ["b", CITY_CROP, 0, 0.4, 0.01],
  ];
  const panel = document.getElementById("debug");
  const hint = document.createElement("div");
  hint.style.cssText = "color:#7f94a2;margin-bottom:6px";
  hint.innerHTML = "Blue line = drag to <b>warp</b>. Orange box = drag to move the <b>cutoff</b>. D = hide.";
  panel.appendChild(hint);
  const out = document.createElement("textarea");
  updateDebugReadout = () => {
    out.value =
      "CITY_ROI " + JSON.stringify(CITY_ROI) + "\n" +
      "CITY_CROP " + JSON.stringify(CITY_CROP) + "\n" +
      "rotate " + CITY_OPTS.rotate + "\n" +
      "sx " + JSON.stringify(GRID.sx) + "\ntx " + JSON.stringify(GRID.tx) + "\n" +
      "sy " + JSON.stringify(GRID.sy) + "\nty " + JSON.stringify(GRID.ty);
  };
  for (const [k, obj, mn, mx, st] of T) {
    const row = document.createElement("div"); row.className = "drow";
    const lab = document.createElement("label"); lab.textContent = k;
    const val = document.createElement("span"); val.textContent = (+obj[k]).toFixed(3);
    const sl = document.createElement("input");
    sl.type = "range"; sl.min = mn; sl.max = mx; sl.step = st; sl.value = obj[k];
    sl.oninput = () => { obj[k] = parseFloat(sl.value); val.textContent = (+obj[k]).toFixed(3); rebuildCity(); updateDebugReadout(); };
    row.append(lab, sl, val); panel.appendChild(row);
  }
  const reset = document.createElement("button");
  reset.textContent = "reset grid (identity)";
  reset.style.cssText = "width:100%;margin-top:6px";
  reset.onclick = () => { GRID.tx = GRID.sx.slice(); GRID.ty = GRID.sy.slice(); rebuildCity(); updateDebugReadout(); };
  panel.append(reset, out);
  updateDebugReadout();
  window.addEventListener("keydown", e => {
    if (e.key === "d" || e.key === "D") toggleGrid();
    else if (e.key === "p" || e.key === "P") togglePopup();
  });
}

init();
setInterval(refreshLive, 30000);
setInterval(animateTrains, 50);
</script>
